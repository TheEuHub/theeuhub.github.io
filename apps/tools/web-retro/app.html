<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Retro - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Web Retro</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<script data-proton-app>
/* proton app module: web-retro — user-ROM-only launcher built on the vendored
 * Libretro WASM runtime (webretro/launch.html). No ROMs are preinstalled; users
 * load their own game files from their device, drag-and-drop, or proton Files,
 * handed directly to the emulator over an in-browser BroadcastChannel. */
'use strict';

/* ============================ WEB RETRO ============================ */
registerApp({
  /* Metadata (name, icon, cat, desc, w, h) lives in the app catalog:
   * data/applications.js — edit it there, not here. */
  render(body, options = {}) {
    const LAUNCH = 'apps/tools/web-retro/webretro/launch.html';
    const CONSOLES = [
      { id: 'NES', core: 'nestopia', label: 'NES', sub: 'Nintendo Entertainment System', exts: ['.nes', '.fds', '.unf', '.unif'] },
      { id: 'SNES', core: 'snes9x', label: 'SNES', sub: 'Super Nintendo', exts: ['.smc', '.sfc', '.swc', '.fig', '.bs'] },
      { id: 'N64', core: 'mupen64plus_next', label: 'N64', sub: 'Nintendo 64', exts: ['.z64', '.n64', '.v64', '.u1', '.ndd'] },
      { id: 'GB', core: 'mgba', label: 'GB / GBA', sub: 'Game Boy / GBC / GBA', exts: ['.gb', '.gbc', '.gba'] },
    ];
    const CORE_BY_ID = Object.fromEntries(CONSOLES.map((c) => [c.core, c]));
    const EXT_TO_CORE = {};
    for (const c of CONSOLES) {
      for (const ext of c.exts) EXT_TO_CORE[ext] = c.core;
    }
    const ALL_ACCEPT = [...Object.keys(EXT_TO_CORE), '.zip'].join(',');

    let selectedCore = '';
    let pendingZipFile = null;
    let activeLaunch = null;
    let vfsDir = FS.home();
    let bc = null;
    let extBc = null;

    body.innerHTML = `<style>
      .wr-root{flex:1;min-height:0;display:flex;flex-direction:column;background:#080808}
      .wr-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:16px;gap:14px}
      .wr-hero{border:1px solid #2b2b2b;background:#111;border-radius:10px;padding:14px 16px}
      .wr-hero h3{margin:0 0 4px;font-size:15.5px;color:#fff}
      .wr-hero p{margin:0;font-size:12.5px;line-height:1.45}
      .wr-drop{border:1.5px dashed #3d3d3d;background:#0d0d0d;border-radius:10px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:border-color .15s,background .15s}
      .wr-drop.drag{border-color:var(--accent);background:#171717}
      .wr-drop strong{font-size:14px;color:#fff}
      .wr-drop small{font-size:12px;color:#a0a0a0;line-height:1.4}
      .wr-drop-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:2px}
      .wr-section-label{font-size:12px;font-weight:600;color:#b8b8b8;text-transform:uppercase;letter-spacing:.04em}
      .wr-consoles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
      .wr-console{border:1px solid #3a3a3a;background:#141414;color:#fff;border-radius:10px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
      .wr-console:hover{background:#222;border-color:#5a5a5a}
      .wr-console strong{font-size:16px}
      .wr-console small{font-size:11.5px;opacity:.78;line-height:1.25}
      .wr-console code{font-size:10.5px;opacity:.65;margin-top:2px}
      .wr-topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
      .wr-topbar .wr-back{font-size:28px;min-width:56px;min-height:48px;border:1px solid #444;background:#161616;color:#fff;border-radius:8px;display:grid;place-items:center}
      .wr-topbar .wr-back:hover{background:#262626}
      .wr-exts{font-size:12px;color:#9b9b9b}
      .wr-sources{display:flex;flex-wrap:wrap;gap:10px}
      .wr-vfs{display:flex;flex-direction:column;gap:4px;margin-top:8px}
      .wr-vfs button{border:1px solid #2d2d2d;background:#121212;color:#fff;padding:7px 10px;border-radius:6px;text-align:left;display:flex;align-items:center;gap:8px}
      .wr-vfs button:hover{background:#202020}
      .wr-badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:#222;border:1px solid #3a3a3a;color:#ddd}
    </style>
    ${bar('Web Retro', `
      <button type="button" class="btn sm" id="wr-again" hidden>${iconSvg('refresh')} Change ROM</button>
      <a class="btn sm primary" id="wr-ext" href="${MH.esc(LAUNCH)}" target="_blank" rel="noopener" hidden>${iconSvg('external')} Open in new tab</a>
      <input type="file" id="wr-file" accept="${MH.esc(ALL_ACCEPT)}" hidden>
    `)}
    <div class="wr-root" id="wr-root">
      <div class="wr-body" id="wr-chooser">
        <div id="wr-emu-home" style="display:flex;flex-direction:column;gap:14px">
          <div class="wr-hero">
            <h3>Load your own game or ROM</h3>
            <p class="muted">Web Retro includes no preinstalled ROMs. Drop a ROM file below, browse your files, or pick a system.</p>
          </div>
          <div class="wr-drop" id="wr-drop">
            <strong>Drop a ROM file here</strong>
            <small>NES (.nes, .fds) &middot; SNES (.smc, .sfc) &middot; N64 (.z64, .n64, .v64) &middot; GB / GBC / GBA (.gb, .gbc, .gba) &middot; .zip</small>
            <div class="wr-drop-actions">
              <button type="button" class="btn sm primary" id="wr-quick-device">${iconSvg('upload')} Load from this computer</button>
              <button type="button" class="btn sm" id="wr-quick-vfs">${iconSvg('folder-open')} Load from proton Files</button>
            </div>
          </div>
          <div class="wr-section-label" id="wr-sys-prompt">Or choose a system</div>
          <div class="wr-consoles">
            ${CONSOLES.map((c) => `<button type="button" class="wr-console" data-core="${c.core}"><strong>${c.label}</strong><small>${c.sub}</small><code>${c.exts.join(' ')}</code></button>`).join('')}
          </div>
        </div>
        <div id="wr-upload" hidden>
          <div class="wr-topbar">
            <button type="button" class="wr-back" id="wr-back" title="Back">&#9664;</button>
            <div>
              <h3 style="margin:0"><span id="wr-corename">Load a ROM</span></h3>
              <div class="wr-exts" id="wr-exts"></div>
            </div>
          </div>
          <div class="wr-sources">
            <button type="button" class="btn" data-src="vfs">${iconSvg('folder-open')} proton Files</button>
            <button type="button" class="btn" data-src="device">${iconSvg('upload')} This computer</button>
          </div>
          <div id="wr-vfs-wrap" hidden>
            <div class="muted" id="wr-vfs-cwd" style="margin-top:10px;font-size:12.5px"></div>
            <div class="wr-vfs" id="wr-vfs-list"></div>
          </div>
        </div>
      </div>
      <div id="wr-stage" style="flex:1;min-height:0;display:none;flex-direction:column"></div>
    </div>`;

    const emuHome = body.querySelector('#wr-emu-home');
    const uploadPane = body.querySelector('#wr-upload');
    const dropZone = body.querySelector('#wr-drop');
    const sysPromptEl = body.querySelector('#wr-sys-prompt');
    const coreNameEl = body.querySelector('#wr-corename');
    const extsEl = body.querySelector('#wr-exts');
    const chooserEl = body.querySelector('#wr-chooser');
    const stageEl = body.querySelector('#wr-stage');
    const again = body.querySelector('#wr-again');
    const extBtn = body.querySelector('#wr-ext');
    const fileInput = body.querySelector('#wr-file');
    const vfsWrap = body.querySelector('#wr-vfs-wrap');
    const vfsCwdEl = body.querySelector('#wr-vfs-cwd');
    const vfsListEl = body.querySelector('#wr-vfs-list');

    const closeChannels = () => {
      if (bc) {
        try { bc.close(); } catch {}
        bc = null;
      }
      if (extBc) {
        try { extBc.close(); } catch {}
        extBc = null;
      }
    };

    const extOf = (name) => {
      const m = String(name || '').toLowerCase().match(/(\.[^.]+)$/);
      return m ? m[1] : '';
    };

    const readZipEntryNames = async (blob) => {
      try {
        const buf = await blob.arrayBuffer();
        const view = new DataView(buf);
        const bytes = new Uint8Array(buf);
        const dec = new TextDecoder();
        const names = [];
        const minOff = Math.max(0, bytes.length - 65557);
        for (let i = bytes.length - 22; i >= minOff; i--) {
          if (view.getUint32(i, true) === 0x06054b50) {
            const cdSize = view.getUint32(i + 12, true);
            let p = view.getUint32(i + 16, true);
            const end = Math.min(bytes.length, p + cdSize);
            while (p + 46 <= end && view.getUint32(p, true) === 0x02014b50) {
              const nameLen = view.getUint16(p + 28, true);
              const extraLen = view.getUint16(p + 30, true);
              const commentLen = view.getUint16(p + 32, true);
              if (p + 46 + nameLen <= end) {
                names.push(dec.decode(bytes.subarray(p + 46, p + 46 + nameLen)));
              }
              p += 46 + nameLen + extraLen + commentLen;
            }
            return names;
          }
        }
        let p = 0;
        while (p + 30 <= bytes.length && view.getUint32(p, true) === 0x04034b50) {
          const compSize = view.getUint32(p + 18, true);
          const nameLen = view.getUint16(p + 26, true);
          const extraLen = view.getUint16(p + 28, true);
          if (p + 30 + nameLen <= bytes.length) {
            names.push(dec.decode(bytes.subarray(p + 30, p + 30 + nameLen)));
          }
          p += 30 + nameLen + extraLen + compSize;
          if (compSize === 0 && nameLen === 0) break;
        }
        return names;
      } catch {
        return [];
      }
    };

    const detectCore = async (file) => {
      const ext = extOf(file?.name);
      if (EXT_TO_CORE[ext]) return EXT_TO_CORE[ext];
      if (ext === '.zip') {
        const entries = await readZipEntryNames(file);
        for (const entry of entries) {
          const c = EXT_TO_CORE[extOf(entry)];
          if (c) return c;
        }
      }
      return null;
    };

    const showHome = () => {
      uploadPane.hidden = true;
      emuHome.hidden = false;
      vfsWrap.hidden = true;
      if (!pendingZipFile) {
        sysPromptEl.textContent = 'Or choose a system';
      }
    };

    const showUploadPane = (core, openVfs = false) => {
      selectedCore = core || '';
      pendingZipFile = null;
      const info = CORE_BY_ID[selectedCore];
      coreNameEl.textContent = info ? `${info.label} — Choose a ROM` : 'Choose a ROM (auto-detect system)';
      extsEl.textContent = info
        ? `Accepted: ${info.exts.join(', ')}, .zip`
        : 'Accepted: .nes, .fds, .smc, .sfc, .z64, .n64, .v64, .gb, .gbc, .gba, .zip';
      fileInput.accept = info ? [...info.exts, '.zip'].join(',') : ALL_ACCEPT;
      emuHome.hidden = true;
      uploadPane.hidden = false;
      if (openVfs) renderVfs();
      else vfsWrap.hidden = true;
    };

    const buildChannelUrl = (core, name, channel) =>
      `${LAUNCH}?core=${encodeURIComponent(core)}&rom=channel&name=${encodeURIComponent(name)}&channel=${encodeURIComponent(channel)}`;

    const prepareExtLink = () => {
      if (!activeLaunch) {
        extBtn.hidden = true;
        extBtn.href = LAUNCH;
        return;
      }
      if (extBc) {
        try { extBc.close(); } catch {}
        extBc = null;
      }
      const ch = 'wr_ext_' + Math.random().toString(36).slice(2, 12);
      const launched = activeLaunch;
      extBc = new BroadcastChannel(ch);
      extBc.onmessage = (ev) => {
        if (ev.data?.status === 'ready') {
          try { extBc?.postMessage({ rom: launched.file }); } catch {}
        }
      };
      extBtn.href = buildChannelUrl(launched.core, launched.file.name, ch);
      extBtn.hidden = false;
    };

    const launchFrame = (src) => {
      chooserEl.style.display = 'none';
      stageEl.style.display = 'flex';
      stageEl.innerHTML = `<iframe id="wr-frame" class="site-frame" src="${MH.esc(src)}" title="Web Retro" allowfullscreen style="flex:1;min-height:0;border:0;width:100%;height:100%;background:#000"></iframe>`;
      again.hidden = false;
      prepareExtLink();
    };

    const launchChannelRom = (core, romFile) => {
      closeChannels();
      pendingZipFile = null;
      activeLaunch = { core, file: romFile };
      const ch = 'wr_' + Math.random().toString(36).slice(2, 12);
      bc = new BroadcastChannel(ch);
      const url = buildChannelUrl(core, romFile.name, ch);
      bc.onmessage = (ev) => {
        if (ev.data?.status === 'ready') {
          try { bc?.postMessage({ rom: romFile }); } catch {}
        }
      };
      launchFrame(url);
    };

    const handleRomFile = async (romFile, preferredCore = '') => {
      const ext = extOf(romFile?.name);
      const detected = await detectCore(romFile);
      if (ext !== '.zip' && !EXT_TO_CORE[ext]) {
        MH.toast(`Unsupported file "${romFile.name}" — choose a NES, SNES, N64, GB/GBC/GBA ROM, or .zip archive.`);
        return;
      }
      if (detected) {
        if (preferredCore && preferredCore !== detected) {
          const label = CORE_BY_ID[detected]?.label || detected;
          MH.toast(`Detected ${label} ROM — launching "${romFile.name}" with ${label}.`);
        }
        launchChannelRom(detected, romFile);
        return;
      }
      if (preferredCore) {
        launchChannelRom(preferredCore, romFile);
        return;
      }
      pendingZipFile = romFile;
      showHome();
      sysPromptEl.textContent = `Choose which system should run "${romFile.name}"`;
      MH.toast(`Select which console "${romFile.name}" belongs to.`);
    };

    const openRomPath = async (path) => {
      const st = FS.stat(path);
      if (!st || st.type !== 'file') {
        MH.toast(`ROM not found: ${path}`);
        return;
      }
      const blob = await FS.readBlob(st.path);
      const file = new File([blob], st.name, { type: blob.type || 'application/octet-stream' });
      handleRomFile(file, '');
    };

    const renderVfs = () => {
      vfsWrap.hidden = false;
      vfsCwdEl.textContent = vfsDir;
      vfsListEl.innerHTML = '';
      if (vfsDir !== '/') {
        const up = document.createElement('button');
        up.type = 'button';
        up.dataset.dir = FS.dirname(vfsDir);
        up.innerHTML = `${iconSvg('chevron-left')} ..`;
        up.onclick = () => { vfsDir = FS.dirname(vfsDir); renderVfs(); };
        vfsListEl.appendChild(up);
      }
      for (const item of FS.list(vfsDir)) {
        const b = document.createElement('button');
        b.type = 'button';
        if (item.type === 'dir') {
          b.dataset.dir = item.path;
          b.innerHTML = `${iconSvg('folder')} ${MH.esc(item.name)}`;
          b.onclick = () => { vfsDir = item.path; renderVfs(); };
        } else {
          b.dataset.file = item.path;
          const ext = extOf(item.name);
          const tag = EXT_TO_CORE[ext] ? CORE_BY_ID[EXT_TO_CORE[ext]]?.id : (ext === '.zip' ? 'ZIP' : '');
          b.innerHTML = `${iconSvg('file')} <span>${MH.esc(item.name)}</span>${tag ? `<span class="wr-badge">${MH.esc(tag)}</span>` : ''}`;
          b.onclick = async () => {
            const blob = await FS.readBlob(item.path);
            const file = new File([blob], item.name, { type: blob.type || 'application/octet-stream' });
            handleRomFile(file, selectedCore);
          };
        }
        vfsListEl.appendChild(b);
      }
    };

    const picker = () => {
      closeChannels();
      activeLaunch = null;
      pendingZipFile = null;
      stageEl.innerHTML = '';
      stageEl.style.display = 'none';
      chooserEl.style.display = 'flex';
      again.hidden = true;
      extBtn.hidden = true;
      extBtn.href = LAUNCH;
      showHome();
    };

    again.addEventListener('click', picker);
    extBtn.addEventListener('click', () => { setTimeout(prepareExtLink, 0); });

    const onWindowMessage = (event) => {
      const frame = stageEl.querySelector('#wr-frame');
      if (!frame || !event.data || event.data.type !== 'webretro-back') return;
      if (event.source === frame.contentWindow) picker();
    };
    window.addEventListener('message', onWindowMessage);

    body.querySelectorAll('#wr-emu-home [data-core]').forEach((b) => {
      b.onclick = () => {
        if (pendingZipFile) {
          const f = pendingZipFile;
          pendingZipFile = null;
          launchChannelRom(b.dataset.core, f);
          return;
        }
        showUploadPane(b.dataset.core, false);
      };
    });

    body.querySelector('#wr-quick-device').onclick = () => {
      selectedCore = '';
      pendingZipFile = null;
      fileInput.accept = ALL_ACCEPT;
      fileInput.click();
    };
    body.querySelector('#wr-quick-vfs').onclick = () => showUploadPane('', true);

    body.querySelector('#wr-back').onclick = () => {
      pendingZipFile = null;
      showHome();
    };

    body.querySelector('[data-src="device"]').onclick = () => fileInput.click();
    body.querySelector('[data-src="vfs"]').onclick = () => renderVfs();
    fileInput.onchange = () => {
      const f = fileInput.files?.[0];
      fileInput.value = '';
      if (!f) return;
      handleRomFile(f, selectedCore);
    };

    const onDragOver = (e) => {
      if (!e.dataTransfer?.types?.includes('Files')) return;
      e.preventDefault();
      dropZone.classList.add('drag');
    };
    const onDragLeave = (e) => {
      if (!e.relatedTarget || !dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag');
    };
    const onDrop = (e) => {
      if (!e.dataTransfer?.files?.length) return;
      e.preventDefault();
      dropZone.classList.remove('drag');
      handleRomFile(e.dataTransfer.files[0], selectedCore);
    };
    chooserEl.addEventListener('dragover', onDragOver);
    chooserEl.addEventListener('dragleave', onDragLeave);
    chooserEl.addEventListener('drop', onDrop);

    body.openPath = (opts = {}) => {
      if (opts.path) openRomPath(opts.path);
    };
    body.onDestroy = () => {
      closeChannels();
      window.removeEventListener('message', onWindowMessage);
    };

    showHome();
    if (options.path) openRomPath(options.path);
  },
});
</script>
</body>
</html>
