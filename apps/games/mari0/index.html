<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>Mari0</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a0a; color: #eee; font: 12px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    .bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: #111; border-bottom: 1px solid #2b2b2b; }
    .bar a { color: #9cf; text-decoration: none; }
    .bar button { margin-left: auto; background: #1e1e1e; color: #eee; border: 1px solid #3a3a3a; border-radius: 5px; padding: 3px 9px; cursor: pointer; font: inherit; }
    .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
    #canvas { padding: 0; margin: 0; display: block; border: 0 none; visibility: hidden; }
    #loadingCanvas { max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../">All games</a>
    <span>Move: WASD / Arrows · Jump: Space · Aim &amp; Portals: Mouse</span>
    <button type="button" onclick="goFullScreen()">Fullscreen</button>
  </div>
  <div class="stage">
    <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </div>
  <script type="text/javascript">
    function goFullScreen() {
      var canvas = document.getElementById("canvas");
      if (canvas.requestFullscreen) canvas.requestFullscreen();
      else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
      else if (canvas.mozRequestFullScreen) canvas.mozRequestFullScreen();
    }
    var loadingContext = document.getElementById("loadingCanvas").getContext("2d");
    function drawLoadingText(text) {
      var canvas = loadingContext.canvas;
      loadingContext.fillStyle = "#111820";
      loadingContext.fillRect(0, 0, canvas.width, canvas.height);
      loadingContext.font = "22px sans-serif";
      loadingContext.textAlign = "center";
      loadingContext.fillStyle = "#e8eef5";
      loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
    }
    window.onload = function() { window.focus(); };
    window.onclick = function() { window.focus(); };
    window.addEventListener("keydown", function(e) {
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
    }, false);
    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 67108864,
      printErr: console.error.bind(console),
      canvas: (function() {
        var canvas = document.getElementById("canvas");
        canvas.addEventListener("webglcontextlost", function(e) { alert("WebGL context lost. You will need to reload the page."); e.preventDefault(); }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (text) {
          drawLoadingText(text);
        } else if (Module.remainingDependencies === 0) {
          document.getElementById("loadingCanvas").style.display = "none";
          document.getElementById("canvas").style.visibility = "visible";
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "All downloads complete.");
      }
    };
    Module.setStatus("Downloading...");
    window.onerror = function() {
      Module.setStatus("Exception thrown, see JavaScript console");
      Module.setStatus = function(text) { if (text) Module.printErr("[post-exception status] " + text); };
    };
    var applicationLoad = function() { Love(Module); };
  </script>
  <script type="text/javascript" src="game.js"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad()"></script>
</body>
</html>
