<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloons Tower Defense 2 - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../../index.html">proton</a> and launch <b>Bloons Tower Defense 2</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
'use strict';

const GAME_PAGE = 'apps/games/bloons-tower-defense-2/bloonstowerdefense2.html';

registerApp({
  page: GAME_PAGE,
  render(body) {
    body.innerHTML = `${bar('Bloons Tower Defense 2', `<button type="button" class="btn sm" data-e="reload">${iconSvg('refresh')} Reload</button><button type="button" class="btn sm" data-e="fs">${iconSvg('monitor')} Fullscreen</button><a class="btn sm primary" data-e="ext" href="${MH.esc(GAME_PAGE)}" target="_blank" rel="noopener">${iconSvg('external')} Open in new tab</a>`)}
    <iframe class="site-frame" src="${GAME_PAGE}" title="Bloons Tower Defense 2" allowfullscreen style="flex:1;min-height:0;border:0;width:100%;height:100%;background:#000"></iframe>`;
    const frame = body.querySelector('iframe.site-frame');
    const ext = body.querySelector('[data-e="ext"]');
    if (ext) ext.href = GAME_PAGE;
    body.querySelector('[data-e="reload"]').onclick = () => { frame.src = GAME_PAGE; };
    body.querySelector('[data-e="fs"]').onclick = () => {
      if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {});
    };
  },
});
</script>
</body>
</html>
